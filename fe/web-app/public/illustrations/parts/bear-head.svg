    <path d="M 140 73 Q 146 71 150 74" fill="none" stroke="#241d21" stroke-width="2" stroke-linecap="round"/>
    <path d="M 180 73 Q 174 71 170 74" fill="none" stroke="#241d21" stroke-width="2" stroke-linecap="round"/>
    <!-- Dark Heart/Oval Nose -->
