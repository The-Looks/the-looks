    <path d="M 136 172 L 184 172 L 210 242 C 176 248, 144 248, 110 242 Z"
          fill="#f5dce1" stroke="#241d21" stroke-width="3" stroke-linejoin="round"/>
    <!-- Burgundy Velvet Hem Ribbon -->
    <path d="M 113 234 C 145 240, 175 240, 207 234 L 209 238 C 177 244, 143 244, 111 238 Z" fill="#771e35"/>
