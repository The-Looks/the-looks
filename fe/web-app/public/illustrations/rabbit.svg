    <line x1="172" y1="267" x2="184" y2="267" stroke="#241d21" stroke-width="2" stroke-linecap="round"/>
    <circle cx="184" cy="267" r="1.5" fill="#fff7f3"/>
  </g>
  <!-- Romantic Dress -->
