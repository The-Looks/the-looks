    <path d="M 124 152 L 138 168 L 150 162 L 132 148 Z" fill="#fff7f3" stroke="#241d21" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 196 152 L 182 168 L 170 162 L 188 148 Z" fill="#fff7f3" stroke="#241d21" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Vintage Book in Paws -->
    <rect x="142" y="156" width="36" height="24" rx="2" fill="#4a6882" stroke="#241d21" stroke-width="2.5"/>
    <rect x="146" y="158" width="28" height="20" rx="1" fill="#fff7f3" stroke="#241d21" stroke-width="1.5"/>
    <path d="M 160 156 L 160 180" stroke="#771e35" stroke-width="2"/>
    <circle cx="140" cy="168" r="5" fill="#fff7f3" stroke="#241d21" stroke-width="2"/>
    <circle cx="180" cy="168" r="5" fill="#fff7f3" stroke="#241d21" stroke-width="2"/>
