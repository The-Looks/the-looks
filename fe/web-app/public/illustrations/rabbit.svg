    <path d="M 160 126 C 170 124, 184 128, 182 136 C 178 142, 166 138, 160 130 Z"
          fill="#fff7f3" stroke="#241d21" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Velvet Neck Bow -->
    <ellipse cx="153" cy="130" rx="6" ry="4" transform="rotate(-15 153 130)" fill="#771e35" stroke="#241d21" stroke-width="1.8"/>
    <ellipse cx="167" cy="130" rx="6" ry="4" transform="rotate(15 167 130)" fill="#771e35" stroke="#241d21" stroke-width="1.8"/>
    <circle cx="160" cy="130" r="3" fill="#771e35" stroke="#241d21" stroke-width="1.8"/>
    <path d="M 158 132 L 154 140" stroke="#771e35" stroke-width="2" stroke-linecap="round"/>
    <path d="M 162 132 L 166 140" stroke="#771e35" stroke-width="2" stroke-linecap="round"/>
