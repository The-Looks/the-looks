    <circle cx="160" cy="144" r="2" fill="#771e35"/>
    <circle cx="160" cy="156" r="2" fill="#771e35"/>
    <circle cx="160" cy="166" r="2" fill="#771e35"/>
    <!-- Puff Sleeves -->
    <ellipse cx="124" cy="138" rx="12" ry="14" fill="#f5dce1" stroke="#241d21" stroke-width="2.8"/>
    <rect x="114" y="148" width="16" height="4" rx="1.5" fill="#fff7f3" stroke="#241d21" stroke-width="1.8"/>
    <ellipse cx="196" cy="138" rx="12" ry="14" fill="#f5dce1" stroke="#241d21" stroke-width="2.8"/>
    <rect x="190" y="148" width="16" height="4" rx="1.5" fill="#fff7f3" stroke="#241d21" stroke-width="1.8"/>
