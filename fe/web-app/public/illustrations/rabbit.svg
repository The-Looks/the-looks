    <path d="M 142 184 Q 138 210 134 236" fill="none" stroke="#241d21" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 160 182 Q 160 210 160 238" fill="none" stroke="#241d21" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 178 184 Q 182 210 186 236" fill="none" stroke="#241d21" stroke-width="1.8" stroke-linecap="round"/>
