    <path d="M 126 266 C 126 266, 132 263, 144 263 C 150 263, 152 267, 152 273 C 152 278, 148 280, 140 280 L 126 280 C 122 280, 122 275, 122 272 Z"
          fill="#771e35" stroke="#241d21" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="124" y1="280" x2="152" y2="280" stroke="#241d21" stroke-width="3" stroke-linecap="round"/>
    <line x1="130" y1="267" x2="142" y2="267" stroke="#241d21" stroke-width="2" stroke-linecap="round"/>
    <circle cx="142" cy="267" r="1.5" fill="#fff7f3"/>
    <rect x="174" y="252" width="12" height="14" fill="#fff7f3" stroke="#241d21" stroke-width="2"/>
    <path d="M 168 266 C 168 266, 174 263, 186 263 C 192 263, 194 267, 194 273 C 194 278, 190 280, 182 280 L 168 280 C 164 280, 164 275, 164 272 Z"
