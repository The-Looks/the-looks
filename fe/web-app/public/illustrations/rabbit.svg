    <path d="M 188 58 C 202 52, 206 68, 194 74 C 182 78, 174 68, 172 64 Z"
          fill="#771e35" stroke="#241d21" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="160" cy="64" r="5" fill="#771e35" stroke="#241d21" stroke-width="2"/>
    <!-- Left Rabbit Ear (Upright) -->
    <path d="M 144 68 C 136 48, 130 26, 142 16 C 152 6, 160 26, 154 66 Z"
          fill="#fff7f3" stroke="#241d21" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 143 56 C 138 42, 136 28, 144 22 C 148 18, 153 28, 150 56 Z" fill="#f5dce1"/>
