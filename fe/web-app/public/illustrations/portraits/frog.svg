<svg xmlns="http://www.w3.org/2000/svg" viewBox="107 12 120 120">
  <rect x="107" y="12" width="120" height="120" fill="#fbe4ea"/>
  <g id="head">
    <!-- Bulbous Frog Eyes (Dome shape on top of head) -->
    <circle cx="136" cy="62" r="15" fill="#648653" stroke="#241d21" stroke-width="3"/>
    <circle cx="136" cy="62" r="10" fill="#edf3e4"/>
    <circle cx="136" cy="62" r="5" fill="#241d21"/>
    <circle cx="134" cy="60" r="1.8" fill="#fff7f3"/>
    <!-- Wide Frog Head -->
    <ellipse cx="160" cy="88" rx="38" ry="24" fill="#648653" stroke="#241d21" stroke-width="3"/>
    <!-- Pale Chin / Throat -->
    <path d="M 138 94 C 144 104, 176 104, 182 94 C 172 108, 148 108, 138 94 Z" fill="#edf3e4"/>
    <!-- Artsy Burgundy Beret (Tilted jauntily over right eye) -->
    <g id="beret">
      <!-- Right eye partially peek beneath beret -->
      <circle cx="184" cy="62" r="15" fill="#648653" stroke="#241d21" stroke-width="3"/>
      <circle cx="184" cy="62" r="10" fill="#edf3e4"/>
      <circle cx="184" cy="62" r="5" fill="#241d21"/>
      <circle cx="182" cy="60" r="1.8" fill="#fff7f3"/>
      <!-- Beret Volume -->
      <path d="M 152 56 C 146 36, 188 28, 206 40 C 218 48, 214 62, 198 68 C 176 74, 158 68, 152 56 Z"
            fill="#771e35" stroke="#241d21" stroke-width="3" stroke-linejoin="round"/>
      <!-- Beret Band -->
      <path d="M 164 64 C 174 68, 192 68, 202 62" fill="none" stroke="#241d21" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Beret Stem Tab -->
      <path d="M 184 34 L 186 28" stroke="#241d21" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Beret Fold mark -->
      <path d="M 172 44 Q 186 46 196 42" fill="none" stroke="#241d21" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <!-- Rosy Frog Cheeks -->
    <ellipse cx="132" cy="92" rx="6" ry="4" fill="#f5dce1"/>
    <ellipse cx="188" cy="92" rx="6" ry="4" fill="#f5dce1"/>
    <!-- Wide Quirky Smile -->
    <path d="M 136 86 C 148 94, 172 94, 184 86" fill="none" stroke="#241d21" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="136" cy="86" r="1.5" fill="#241d21"/>
    <circle cx="184" cy="86" r="1.5" fill="#241d21"/>
    <!-- Nostril Dots -->
    <circle cx="156" cy="80" r="1.2" fill="#241d21"/>
    <circle cx="164" cy="80" r="1.2" fill="#241d21"/>
  </g>
</svg>
