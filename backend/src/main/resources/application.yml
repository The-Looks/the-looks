spring:
  application:
    name: the-looks
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema chỉ do Flyway quản lý
  mvc:
    problemdetails:
      enabled: true # lỗi trả về chuẩn RFC 9457
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith

thelooks:
  security:
    jwt-secret: ${JWT_SECRET}
