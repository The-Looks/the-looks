openapi: 3.1.0
info:
  title: voting-service
  version: 0.1.0
  description: |
    Ask Friends: bình chọn A/B giữa 2 outfit, chia sẻ link qua Zalo; khách bình chọn ẩn danh. Phụ trách: Member 3 (Phát).
    Lấy ảnh outfit từ outfit-service lúc tạo bình chọn. Giới hạn số lượt gửi để chống spam.
    Quy ước: `/api/app/**` cần JWT, `/api/admin/**` cần role ADMIN, `/api/public/**` không cần đăng nhập.
    Sửa file này trước, review qua PR, rồi mới code (contract-first).
servers:
  - url: http://localhost:8084
    description: local
security:
  - bearerAuth: []
  - cookieAuth: []

paths:
  /api/app/polls:
    get:
      summary: Bình chọn của tôi
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Poll' } }
    post:
      summary: Tạo bình chọn giữa 2 outfit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outfitAId, outfitBId]
              properties:
                outfitAId: { type: string, format: uuid }
                outfitBId: { type: string, format: uuid }
                question: { type: string, maxLength: 140, example: "Đi hẹn hò tối nay nên mặc bộ nào?" }
                ttlHours: { type: integer, minimum: 1, maximum: 168, default: 24 }
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema:
                type: object
                required: [code, shareUrl, expiresAt]
                properties:
                  code: { type: string }
                  shareUrl: { type: string, format: uri, description: 'link gửi qua Zalo, mở trên web-app tại /v/{code}' }
                  expiresAt: { type: string, format: date-time }
        '400': { $ref: 'common.yaml#/components/responses/Problem' }
  /api/public/polls/{code}:
    get:
      summary: Trang bình chọn cho khách (không cần đăng nhập)
      security: []
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Poll' }
        '404': { $ref: 'common.yaml#/components/responses/Problem' }
        '410': { $ref: 'common.yaml#/components/responses/Problem' }
  /api/public/polls/{code}/votes:
    post:
      summary: Khách bình chọn ẩn danh; trả kết quả hiện tại
      security: []
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [choice]
              properties:
                choice: { type: string, enum: [A, B] }
      responses:
        '200':
          description: Kết quả sau khi bình chọn
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PollResult' }
        '404': { $ref: 'common.yaml#/components/responses/Problem' }
        '409': { $ref: 'common.yaml#/components/responses/Problem' }
        '410': { $ref: 'common.yaml#/components/responses/Problem' }
        '429': { $ref: 'common.yaml#/components/responses/Problem' }

  /api/public/polls/{code}/reports:
    post:
      summary: Báo cáo bình chọn vi phạm
      security: []
      parameters: [ { name: code, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 5, maxLength: 300 } } } } } }
      responses:
        '201': { description: Đã nhận báo cáo }
        '409': { $ref: 'common.yaml#/components/responses/Problem' }
        '429': { $ref: 'common.yaml#/components/responses/Problem' }
  /api/admin/polls/reports:
    get:
      summary: Danh sách báo cáo bình chọn
      parameters: [ { name: status, in: query, schema: { type: string, enum: [OPEN, IGNORED, HIDDEN, ALL] } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PollReport' } } } } }
  /api/admin/polls/reports/{id}:
    put:
      summary: Ẩn bình chọn hoặc bỏ qua báo cáo
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [IGNORED, HIDDEN] } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PollReport' } } } }
  /api/admin/polls/audit:
    get:
      summary: Nhật ký kiểm duyệt bình chọn
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PollModerationAudit' } } } } }
  /api/admin/polls/users/{id}/data:
    parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      summary: Số bình chọn của người dùng
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [pollCount], properties: { pollCount: { type: integer } } } } } }
    delete:
      summary: Xóa bình chọn của người dùng
      responses:
        '204': { description: Đã xóa }

components:
  securitySchemes:
    bearerAuth: { $ref: 'common.yaml#/components/securitySchemes/bearerAuth' }
    cookieAuth: { type: apiKey, in: cookie, name: access_token }
  schemas:
    PollReport:
      type: object
      required: [id, pollCode, reason, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        pollCode: { type: string }
        question: { type: [string, 'null'] }
        reason: { type: string }
        status: { type: string, enum: [OPEN, IGNORED, HIDDEN] }
        createdAt: { type: string, format: date-time }
    PollModerationAudit:
      type: object
      required: [id, actorId, pollCode, action, outcome, createdAt]
      properties:
        id: { type: string, format: uuid }
        actorId: { type: string, format: uuid }
        pollCode: { type: string }
        action: { type: string }
        outcome: { type: string, enum: [SUCCESS, FAILED] }
        createdAt: { type: string, format: date-time }
    PollOption:
      type: object
      required: [outfitId, imageUrls]
      properties:
        outfitId: { type: string, format: uuid }
        imageUrls: { type: array, items: { type: string, format: uri } }
    Poll:
      type: object
      required: [code, optionA, optionB, expiresAt]
      properties:
        code: { type: string }
        question: { type: string }
        optionA: { $ref: '#/components/schemas/PollOption' }
        optionB: { $ref: '#/components/schemas/PollOption' }
        expiresAt: { type: string, format: date-time }
        result: { $ref: '#/components/schemas/PollResult' }
    PollResult:
      type: object
      required: [votesA, votesB, percentA, percentB]
      properties:
        votesA: { type: integer }
        votesB: { type: integer }
        percentA: { type: integer }
        percentB: { type: integer }
