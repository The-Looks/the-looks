openapi: 3.1.0
info:
  title: auth-service
  version: 0.1.0
  description: |
    Đăng ký, đăng nhập, phát JWT. Phụ trách: Member 3 (Phát).
    Quy ước: `/api/app/**` cần JWT, `/api/admin/**` cần role ADMIN, `/api/public/**` không cần đăng nhập.
    Sửa file này trước, review qua PR, rồi mới code (contract-first).
servers:
  - url: http://localhost:8081
    description: local
security:
  - bearerAuth: []
  - cookieAuth: []

paths:
  /api/public/auth/register:
    post:
      summary: Đăng ký (người dùng mới luôn có role USER)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, username, acceptedTerms]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                username: { type: string, maxLength: 60 }
                acceptedTerms:
                  type: boolean
                  description: Phải là true. Server lưu thời điểm đồng ý kèm phiên bản Điều khoản / Chính sách quyền riêng tư
      responses:
        '201':
          description: Đã tạo tài khoản
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: 'common.yaml#/components/responses/Problem' }
        '409': { $ref: 'common.yaml#/components/responses/Problem' }
  /api/public/auth/password-policy:
    get:
      summary: Quy tắc mật khẩu dùng cho form đăng ký
      description: Frontend dùng quy tắc này để hiển thị độ mạnh tại chỗ; không gửi mật khẩu khi người dùng đang nhập.
      security: []
      responses:
        '200':
          description: Quy tắc hiện hành của auth-service
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordPolicy' }
  /api/public/auth/login:
    post:
      summary: Đăng nhập, đặt access và refresh token vào cookie HttpOnly
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Đặt access_token và refresh_token qua Set-Cookie; body chỉ có thời điểm hết hạn access token
          content:
            application/json:
              schema:
                type: object
                required: [expiresAt]
                properties:
                  expiresAt: { type: string, format: date-time }
        '401': { $ref: 'common.yaml#/components/responses/Problem' }
  /api/public/auth/refresh:
    post:
      summary: Đổi refresh token trong cookie httpOnly và cấp access token mới
      description: Refresh token có hạn 7 ngày và được xoay vòng mỗi lần sử dụng. Dùng lại token cũ sẽ thu hồi cả phiên.
      security: []
      responses:
        '200':
          description: Access và refresh cookie mới
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: 'common.yaml#/components/responses/Problem' }
  /api/public/auth/logout:
    post:
      summary: Thu hồi phiên hiện tại và xoá access cùng refresh cookie
      security: []
      responses:
        '204': { description: Đã đăng xuất }
  /api/public/auth/session/active:
    get:
      summary: Kiểm tra access token và trạng thái phiên cho các service nội bộ
      description: Yêu cầu Bearer JWT; từ chối khi sid đã bị thu hồi hoặc hết hạn.
      security:
        - bearerAuth: []
      responses:
        '204': { description: Phiên còn hoạt động }
        '401': { $ref: 'common.yaml#/components/responses/Problem' }
  /api/public/auth/google/start:
    get:
      summary: Bắt đầu Google OIDC Authorization Code + PKCE
      description: Server tạo state và nonce ngẫu nhiên, lưu tạm an toàn rồi chuyển hướng đến Google.
      security: []
      responses:
        '302': { description: Chuyển hướng đến Google }
  /api/public/auth/google/callback:
    get:
      summary: Xác thực Google callback rồi chuyển về web-app
      description: Server kiểm tra state và nonce; chỉ gộp tài khoản cùng email khi email_verified là true. Thành công đặt access và refresh cookie rồi chuyển về /auth/callback.
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '302': { description: Chuyển về web-app }
        '401': { $ref: 'common.yaml#/components/responses/Problem' }
  /api/app/me:
    get:
      summary: Thông tin người dùng hiện tại
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
  /api/app/me/profile:
    get:
      summary: Hồ sơ của tài khoản hiện tại
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UserProfile' } } } }
    put:
      summary: Đổi tên và thành phố của tài khoản hiện tại
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string, minLength: 1, maxLength: 60 }
                city: { type: [string, 'null'], maxLength: 120 }
      responses:
        '200': { description: Đã cập nhật, content: { application/json: { schema: { $ref: '#/components/schemas/UserProfile' } } } }
        '400': { $ref: 'common.yaml#/components/responses/Problem' }
  /api/app/me/avatar:
    get:
      summary: Ảnh đại diện của tài khoản hiện tại
      responses:
        '200': { description: Ảnh PNG hoặc JPEG, content: { image/png: { schema: { type: string, format: binary } }, image/jpeg: { schema: { type: string, format: binary } } } }
        '404': { $ref: 'common.yaml#/components/responses/Problem' }
    post:
      summary: Tải ảnh đại diện PNG/JPEG, tối đa 2 MB
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { description: Đã cập nhật, content: { application/json: { schema: { $ref: '#/components/schemas/UserProfile' } } } }
    delete:
      summary: Xóa ảnh đại diện
      responses:
        '200': { description: Đã xóa, content: { application/json: { schema: { $ref: '#/components/schemas/UserProfile' } } } }
  /api/app/me/deletion:
    post:
      summary: Tự xóa tài khoản và toàn bộ dữ liệu liên quan; công việc lỗi được hệ thống thử lại
      responses:
        '200': { description: Tiến độ xóa, content: { application/json: { schema: { $ref: '#/components/schemas/AccountDeletion' } } } }
        '409': { $ref: 'common.yaml#/components/responses/Problem' }
  /api/admin/auth/users:
    get:
      summary: Danh sách tài khoản cho quản trị viên (cần ADMIN_ACCESS)
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        '200':
          description: Trang người dùng
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUsersPage' }
        '403': { $ref: 'common.yaml#/components/responses/Problem' }

  /api/admin/auth/stats:
    get:
      summary: (ADMIN) Người dùng mới và người dùng hoạt động theo ngày (giờ Việt Nam)
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 90, default: 30 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserStats' }
        '403': { $ref: 'common.yaml#/components/responses/Problem' }

  /api/app/me/auth-methods:
    get:
      summary: Các cách đăng nhập đã thiết lập
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [hasPassword], properties: { hasPassword: { type: boolean } } }
  /api/app/me/password:
    post:
      summary: Đặt mật khẩu cho tài khoản Google trong 10 phút sau khi đăng nhập
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [password], properties: { password: { type: string, minLength: 8, maxLength: 256 } } }
      responses:
        '204': { description: Đã đặt mật khẩu }
        '403': { $ref: 'common.yaml#/components/responses/Problem' }
        '409': { $ref: 'common.yaml#/components/responses/Problem' }

  /api/admin/auth/users/{id}:
    get:
      summary: Chi tiết tài khoản và quyền
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUserDetail' } } } }
  /api/admin/auth/users/{id}/status:
    put:
      summary: Khóa hoặc mở tài khoản; khóa thu hồi mọi phiên
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [ACTIVE, LOCKED] } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUserDetail' } } } }
  /api/admin/auth/users/{id}/roles/{role}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: role, in: path, required: true, schema: { type: string } }
    put:
      summary: Gán vai trò cho người dùng
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUserDetail' } } } }
    delete:
      summary: Gỡ vai trò của người dùng
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUserDetail' } } } }
  /api/admin/auth/roles:
    get:
      summary: Danh sách vai trò
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdminRole' } } } } }
    post:
      summary: Tạo vai trò
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code, name], properties: { code: { type: string }, name: { type: string } } } } } }
      responses:
        '201': { description: Đã tạo, content: { application/json: { schema: { $ref: '#/components/schemas/AdminRole' } } } }
  /api/admin/auth/roles/{code}:
    parameters: [ { name: code, in: path, required: true, schema: { type: string } } ]
    put:
      summary: Đổi tên vai trò
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminRole' } } } }
    delete:
      summary: Xóa vai trò chưa được sử dụng
      responses:
        '204': { description: Đã xóa }
  /api/admin/auth/roles/{code}/permissions:
    put:
      summary: Thay danh sách quyền của vai trò
      parameters: [ { name: code, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [permissions], properties: { permissions: { type: array, items: { type: string } } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminRole' } } } }
  /api/admin/auth/permissions:
    get:
      summary: Danh sách quyền hạn
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdminPermission' } } } } }
    post:
      summary: Tạo quyền hạn
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code, description], properties: { code: { type: string }, description: { type: string } } } } } }
      responses:
        '201': { description: Đã tạo, content: { application/json: { schema: { $ref: '#/components/schemas/AdminPermission' } } } }
  /api/admin/auth/permissions/{code}:
    parameters: [ { name: code, in: path, required: true, schema: { type: string } } ]
    put:
      summary: Sửa mô tả quyền hạn
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [description], properties: { description: { type: string } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminPermission' } } } }
    delete:
      summary: Xóa quyền hạn chưa được sử dụng
      responses:
        '204': { description: Đã xóa }
  /api/admin/auth/audit:
    get:
      summary: Nhật ký thao tác admin
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: outcome, in: query, schema: { type: string, enum: [ALL, SUCCESS, FAILED] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdminAudit' } } } } }
  /api/admin/auth/users/{id}/deletion:
    parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      summary: Trạng thái yêu cầu xóa tài khoản
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AccountDeletion' } } } }
    post:
      summary: Bắt đầu hoặc thử lại xóa dữ liệu ở mọi service
      responses:
        '200': { description: Tiến độ, content: { application/json: { schema: { $ref: '#/components/schemas/AccountDeletion' } } } }

components:
  securitySchemes:
    bearerAuth: { $ref: 'common.yaml#/components/securitySchemes/bearerAuth' }
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
  schemas:
    UserProfile:
      type: object
      required: [username, hasAvatar]
      properties:
        username: { type: string }
        city: { type: [string, 'null'] }
        hasAvatar: { type: boolean }
        avatarUpdatedAt: { type: [string, 'null'], format: date-time }
    DailyCount:
      type: object
      required: [date, count]
      properties:
        date: { type: string, format: date }
        count: { type: integer, format: int64 }
    UserStats:
      type: object
      required: [totalUsers, newLast7Days, activeLast7Days, newUsers, activeUsers]
      properties:
        totalUsers: { type: integer, format: int64 }
        newLast7Days: { type: integer, format: int64 }
        activeLast7Days: { type: integer, format: int64, description: Số người khác nhau mở app trong 7 ngày }
        newUsers: { type: array, items: { $ref: '#/components/schemas/DailyCount' } }
        activeUsers: { type: array, items: { $ref: '#/components/schemas/DailyCount' }, description: Người mở app trong ngày (DAU) }
    PasswordPolicy:
      type: object
      required: [minLength, strongLength, recommendedCharacterTypes]
      properties:
        minLength: { type: integer, minimum: 1, example: 8 }
        strongLength: { type: integer, minimum: 1, example: 12 }
        recommendedCharacterTypes: { type: integer, minimum: 1, maximum: 4, example: 3 }
    User:
      type: object
      required: [id, email, username, roles, permissions, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        username: { type: string }
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
    AdminUserDetail:
      type: object
      required: [id, username, email, status, emailVerified, createdAt, roles, permissions]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string, format: email }
        status: { type: string, enum: [ACTIVE, LOCKED] }
        emailVerified: { type: boolean }
        createdAt: { type: string, format: date-time }
        roles: { type: array, items: { type: string } }
        permissions: { type: array, items: { type: string } }
    AdminRole:
      type: object
      required: [code, name, permissions, system]
      properties:
        code: { type: string }
        name: { type: string }
        permissions: { type: array, items: { type: string } }
        system: { type: boolean }
    AdminPermission:
      type: object
      required: [code, description, system]
      properties:
        code: { type: string }
        description: { type: string }
        system: { type: boolean }
    AdminAudit:
      type: object
      required: [id, actorId, action, outcome, createdAt]
      properties:
        id: { type: string, format: uuid }
        actorId: { type: string, format: uuid }
        targetId: { type: [string, 'null'] }
        action: { type: string }
        detail: { type: [string, 'null'] }
        outcome: { type: string, enum: [SUCCESS, FAILED] }
        createdAt: { type: string, format: date-time }
    AccountDeletion:
      type: object
      required: [targetId, actorId, step, status, createdAt, updatedAt]
      properties:
        targetId: { type: string, format: uuid }
        actorId: { type: string, format: uuid }
        step: { type: string }
        status: { type: string, enum: [PENDING, RUNNING, FAILED, DONE] }
        lastError: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminUser:
      type: object
      required: [id, username, email, status, emailVerified, createdAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string, format: email }
        status: { type: string, enum: [ACTIVE, LOCKED] }
        emailVerified: { type: boolean }
        createdAt: { type: string, format: date-time }
    AdminUsersPage:
      type: object
      required: [items, total, page, size]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminUser' } }
        total: { type: integer, format: int64 }
        page: { type: integer }
        size: { type: integer }
    Session:
      type: object
      required: [expiresAt]
      properties:
        expiresAt: { type: string, format: date-time }
