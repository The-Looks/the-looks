openapi: 3.1.0
info:
  title: auth-service
  version: 0.1.0
  description: |
    Đăng ký, đăng nhập, phát JWT. Phụ trách: Member 3 (Phát).
    Quy ước: `/api/app/**` cần JWT, `/api/admin/**` cần role ADMIN, `/api/public/**` không cần đăng nhập.
    Sửa file này trước, review qua PR, rồi mới code (contract-first).
servers:
  - url: http://localhost:8081
    description: local
security:
  - bearerAuth: []

paths:
  /api/public/auth/register:
    post:
      summary: Đăng ký (người dùng mới luôn có role USER)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, username]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                username: { type: string, maxLength: 60 }
      responses:
        '201':
          description: Đã tạo tài khoản
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: 'common.yaml#/components/responses/Problem' }
        '409': { $ref: 'common.yaml#/components/responses/Problem' }
  /api/public/auth/login:
    post:
      summary: Đăng nhập, nhận JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, expiresAt]
                properties:
                  accessToken: { type: string }
                  expiresAt: { type: string, format: date-time }
        '401': { $ref: 'common.yaml#/components/responses/Problem' }
  /api/public/auth/refresh:
    post:
      summary: Đổi refresh token trong cookie httpOnly và cấp access token mới
      description: Refresh token có hạn 7 ngày và được xoay vòng mỗi lần sử dụng. Dùng lại token cũ sẽ thu hồi cả phiên.
      security: []
      responses:
        '200':
          description: Access token mới; Set-Cookie chứa refresh token mới
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessToken' }
        '401': { $ref: 'common.yaml#/components/responses/Problem' }
  /api/public/auth/logout:
    post:
      summary: Thu hồi phiên hiện tại và xoá refresh cookie
      security: []
      responses:
        '204': { description: Đã đăng xuất }
  /api/public/auth/session/active:
    get:
      summary: Kiểm tra access token và trạng thái phiên cho các service nội bộ
      description: Yêu cầu Bearer JWT; từ chối khi sid đã bị thu hồi hoặc hết hạn.
      security:
        - bearerAuth: []
      responses:
        '204': { description: Phiên còn hoạt động }
        '401': { $ref: 'common.yaml#/components/responses/Problem' }
  /api/public/auth/google/start:
    get:
      summary: Bắt đầu Google OIDC Authorization Code + PKCE
      description: Server tạo state và nonce ngẫu nhiên, lưu tạm an toàn rồi chuyển hướng đến Google.
      security: []
      responses:
        '302': { description: Chuyển hướng đến Google }
  /api/public/auth/google/callback:
    get:
      summary: Xác thực Google callback rồi chuyển về web-app
      description: Server kiểm tra state và nonce; chỉ gộp tài khoản cùng email khi email_verified là true. Thành công đặt refresh cookie rồi chuyển về /auth/callback.
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '302': { description: Chuyển về web-app }
        '401': { $ref: 'common.yaml#/components/responses/Problem' }
  /api/app/me:
    get:
      summary: Thông tin người dùng hiện tại
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }

components:
  securitySchemes:
    bearerAuth: { $ref: 'common.yaml#/components/securitySchemes/bearerAuth' }
  schemas:
    User:
      type: object
      required: [id, email, username, roles, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        username: { type: string }
        roles:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
    AccessToken:
      type: object
      required: [accessToken, expiresAt]
      properties:
        accessToken: { type: string }
        expiresAt: { type: string, format: date-time }
