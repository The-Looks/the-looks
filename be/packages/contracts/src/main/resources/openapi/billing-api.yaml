openapi: 3.1.0
info:
  title: billing-service
  version: 0.1.0
  description: |
    Gói thuê bao Free / Plus / Pro (Plus, Pro trả theo tháng hoặc năm), thanh toán qua PayOS (VietQR, MoMo, ngân hàng).
    Tự gia hạn (mặc định bật): nhắc trước 3 ngày, giữ quyền lợi thêm 3 ngày ân hạn sau ngày hết hạn.
    Service khác lấy giới hạn của người dùng qua GET /api/app/billing/me (chuyển tiếp JWT).
    Quy ước: `/api/app/**` cần JWT, `/api/public/**` không cần đăng nhập.
servers:
  - url: http://localhost:8085
    description: local
security:
  - bearerAuth: []
paths:
  /api/public/billing/plans:
    get:
      summary: Bảng giá và quyền lợi 3 gói
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PlanInfo' } }
  /api/app/billing/me:
    get:
      summary: Gói và giới hạn hiện tại của người dùng (FREE nếu chưa mua hoặc đã hết hạn)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entitlements' }
  /api/app/billing/me/auto-renew:
    put:
      summary: Bật / tắt tự gia hạn gói đang dùng
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: Gói sau khi đổi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entitlements' }
        '400': { $ref: 'common.yaml#/components/responses/Problem' }
  /api/app/billing/checkout:
    post:
      summary: Tạo đơn mua / gia hạn gói và link thanh toán. Đổi gói khi còn hạn thì thời gian còn lại được quy đổi, không mất tiền.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan, period]
              properties:
                plan: { type: string, enum: [PLUS, PRO] }
                period: { $ref: '#/components/schemas/BillingPeriod' }
      responses:
        '201':
          description: Đã tạo đơn; chuyển người dùng tới checkoutUrl
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: 'common.yaml#/components/responses/Problem' }
        '503': { $ref: 'common.yaml#/components/responses/Problem' }
  /api/app/billing/orders/{orderCode}/confirm:
    post:
      summary: Gọi khi người dùng quay lại từ trang thanh toán; nếu đã trả tiền thì kích hoạt gói
      parameters:
        - { name: orderCode, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Trạng thái đơn sau khi kiểm tra
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: 'common.yaml#/components/responses/Problem' }
  /api/public/billing/payos/webhook:
    post:
      summary: Webhook của PayOS (xác thực bằng chữ ký HMAC-SHA256 checksum key)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Đã nhận }
        '400': { description: Sai chữ ký }
  /api/admin/billing/stats:
    get:
      summary: (ADMIN) Người đang dùng gói, đơn đã thanh toán và doanh thu theo ngày (giờ Việt Nam)
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 90, default: 30 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingStats' }
        '403': { $ref: 'common.yaml#/components/responses/Problem' }
  /api/admin/billing/users/{id}/data:
    parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      summary: Gói còn hạn của người dùng
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [plan], properties: { plan: { type: string }, expiresAt: { type: [string, 'null'], format: date-time } } } } } }
    delete:
      summary: Xóa gói và tách mã người dùng khỏi đơn thanh toán
      responses:
        '204': { description: Đã xử lý }

components:
  securitySchemes:
    bearerAuth: { $ref: 'common.yaml#/components/securitySchemes/bearerAuth' }
  schemas:
    AdminOrderPage:
      type: object
      required: [items, total, page, size]
      properties:
        total: { type: integer, format: int64 }
        page: { type: integer }
        size: { type: integer }
        items:
          type: array
          items:
            type: object
            required: [orderCode, ownerId, plan, period, amountVnd, status, createdAt]
            properties:
              orderCode: { type: integer, format: int64 }
              ownerId: { type: string, format: uuid }
              plan: { $ref: '#/components/schemas/Plan' }
              period: { $ref: '#/components/schemas/BillingPeriod' }
              amountVnd: { type: integer, format: int64 }
              status: { type: string, enum: [PENDING, PAID, CANCELLED, REFUNDED] }
              createdAt: { type: string, format: date-time }
              paidAt: { type: [string, 'null'], format: date-time }
              refundedAt: { type: [string, 'null'], format: date-time }
              refundReason: { type: [string, 'null'] }
    BillingStats:
      type: object
      required: [plusSubscribers, proSubscribers, paidOrders, revenueVnd, daily]
      properties:
        plusSubscribers: { type: integer, format: int64 }
        proSubscribers: { type: integer, format: int64 }
        paidOrders: { type: integer, format: int64 }
        revenueVnd: { type: integer, format: int64 }
        daily:
          type: array
          items:
            type: object
            required: [date, paidOrders, revenueVnd]
            properties:
              date: { type: string, format: date }
              paidOrders: { type: integer, format: int64 }
              revenueVnd: { type: integer, format: int64 }
    Plan: { type: string, enum: [FREE, PLUS, PRO] }
    BillingPeriod: { type: string, enum: [MONTHLY, YEARLY] }
    Feature:
      type: string
      enum: [WARDROBE_STATS, COST_PER_WEAR, WEAR_CALENDAR, TRY_ON_3D]
      description: Tính năng chỉ gói Pro có
    Limits:
      type: object
      required: [aiSuggestionsPerDay]
      properties:
        wardrobeItems: { type: [integer, 'null'], description: null = không giới hạn }
        aiSuggestionsPerDay: { type: integer }
    PlanInfo:
      type: object
      required: [plan, name, monthlyPriceVnd, yearlyPriceVnd, limits, features]
      properties:
        plan: { $ref: '#/components/schemas/Plan' }
        name: { type: string }
        monthlyPriceVnd: { type: integer, format: int64 }
        yearlyPriceVnd: { type: integer, format: int64 }
        limits: { $ref: '#/components/schemas/Limits' }
        features: { type: array, items: { $ref: '#/components/schemas/Feature' } }
    Entitlements:
      type: object
      required: [plan, autoRenew, limits, features]
      properties:
        plan: { $ref: '#/components/schemas/Plan' }
        expiresAt: { type: [string, 'null'], format: date-time, description: Ngày hết kỳ đã trả (null với FREE) }
        period: { oneOf: [{ $ref: '#/components/schemas/BillingPeriod' }, { type: 'null' }] }
        autoRenew: { type: boolean }
        status:
          type: [string, 'null']
          enum: [ACTIVE, RENEWAL_DUE, GRACE, null]
          description: RENEWAL_DUE = còn ≤ 3 ngày; GRACE = đã quá hạn, còn trong 3 ngày ân hạn. null với FREE
        limits: { $ref: '#/components/schemas/Limits' }
        features: { type: array, items: { $ref: '#/components/schemas/Feature' } }
    Order:
      type: object
      required: [orderCode, plan, period, amountVnd, status, createdAt]
      properties:
        orderCode: { type: integer, format: int64 }
        plan: { $ref: '#/components/schemas/Plan' }
        period: { $ref: '#/components/schemas/BillingPeriod' }
        amountVnd: { type: integer, format: int64 }
        status: { type: string, enum: [PENDING, PAID, CANCELLED, REFUNDED] }
        checkoutUrl: { type: string, format: uri }
        createdAt: { type: string, format: date-time }
        paidAt: { type: [string, 'null'], format: date-time }
