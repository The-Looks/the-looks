openapi: 3.1.0
info:
  title: billing-service
  version: 0.1.0
  description: |
    Gói thuê bao Free / Plus / Pro (Plus, Pro trả theo tháng hoặc năm), thanh toán VietQR qua SePay.
    Tự gia hạn (mặc định bật): nhắc trước 3 ngày, giữ quyền lợi thêm 3 ngày ân hạn sau ngày hết hạn.
    Service khác lấy giới hạn của người dùng qua GET /api/app/billing/me (chuyển tiếp JWT).
    Quy ước: `/api/app/**` cần JWT, `/api/public/**` không cần đăng nhập.
servers:
  - url: http://localhost:8085
    description: local
security:
  - bearerAuth: []
paths:
  /api/public/billing/plans:
    get:
      summary: Bảng giá và quyền lợi 3 gói
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PlanInfo' } }
  /api/app/billing/me:
    get:
      summary: Gói và giới hạn hiện tại của người dùng (FREE nếu chưa mua hoặc đã hết hạn)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entitlements' }
  /api/app/billing/me/auto-renew:
    put:
      summary: Bật / tắt tự gia hạn gói đang dùng
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: Gói sau khi đổi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entitlements' }
        '400': { $ref: 'common.yaml#/components/responses/Problem' }
  /api/app/billing/checkout:
    post:
      summary: Tạo đơn mua / gia hạn gói và mã VietQR. Đổi gói khi còn hạn thì thời gian còn lại được quy đổi, không mất tiền.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan, period]
              properties:
                plan: { type: string, enum: [PLUS, PRO] }
                period: { $ref: '#/components/schemas/BillingPeriod' }
      responses:
        '201':
          description: Đã tạo đơn; hiện ảnh QR ở checkoutUrl
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: 'common.yaml#/components/responses/Problem' }
  /api/app/billing/orders/{orderCode}/confirm:
    post:
      summary: Trang thanh toán hỏi định kỳ xem đơn đã nhận tiền chưa (gói kích hoạt khi webhook báo tiền vào)
      parameters:
        - { name: orderCode, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Trạng thái đơn sau khi kiểm tra
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: 'common.yaml#/components/responses/Problem' }
  /api/public/billing/sepay/webhook:
    post:
      summary: Webhook của SePay khi có tiền vào (header Authorization "Apikey <key>")
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: 'Đã nhận: {"success": true}' }
        '401': { description: Sai API key }
components:
  securitySchemes:
    bearerAuth: { $ref: 'common.yaml#/components/securitySchemes/bearerAuth' }
  schemas:
    Plan: { type: string, enum: [FREE, PLUS, PRO] }
    BillingPeriod: { type: string, enum: [MONTHLY, YEARLY] }
    Feature:
      type: string
      enum: [WARDROBE_STATS, COST_PER_WEAR, WEAR_CALENDAR, TRY_ON_3D]
      description: Tính năng chỉ gói Pro có
    Limits:
      type: object
      required: [aiSuggestionsPerDay]
      properties:
        wardrobeItems: { type: [integer, 'null'], description: null = không giới hạn }
        aiSuggestionsPerDay: { type: integer }
    PlanInfo:
      type: object
      required: [plan, name, monthlyPriceVnd, yearlyPriceVnd, limits, features]
      properties:
        plan: { $ref: '#/components/schemas/Plan' }
        name: { type: string }
        monthlyPriceVnd: { type: integer, format: int64 }
        yearlyPriceVnd: { type: integer, format: int64 }
        limits: { $ref: '#/components/schemas/Limits' }
        features: { type: array, items: { $ref: '#/components/schemas/Feature' } }
    Entitlements:
      type: object
      required: [plan, autoRenew, limits, features]
      properties:
        plan: { $ref: '#/components/schemas/Plan' }
        expiresAt: { type: [string, 'null'], format: date-time, description: Ngày hết kỳ đã trả (null với FREE) }
        period: { oneOf: [{ $ref: '#/components/schemas/BillingPeriod' }, { type: 'null' }] }
        autoRenew: { type: boolean }
        status:
          type: [string, 'null']
          enum: [ACTIVE, RENEWAL_DUE, GRACE, null]
          description: RENEWAL_DUE = còn ≤ 3 ngày; GRACE = đã quá hạn, còn trong 3 ngày ân hạn. null với FREE
        limits: { $ref: '#/components/schemas/Limits' }
        features: { type: array, items: { $ref: '#/components/schemas/Feature' } }
    Order:
      type: object
      required: [orderCode, plan, period, amountVnd, status, createdAt]
      properties:
        orderCode: { type: integer, format: int64 }
        plan: { $ref: '#/components/schemas/Plan' }
        period: { $ref: '#/components/schemas/BillingPeriod' }
        amountVnd: { type: integer, format: int64 }
        status: { type: string, enum: [PENDING, PAID, CANCELLED] }
        checkoutUrl: { type: string, format: uri, description: URL ảnh VietQR để người dùng quét }
        createdAt: { type: string, format: date-time }
        paidAt: { type: [string, 'null'], format: date-time }
