# Thành phần dùng chung cho mọi *-api.yaml. Không phải một API riêng.
openapi: 3.1.0
info:
  title: The Looks - common components
  version: 0.1.0
paths: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT do identity-service phát (claim sub = userId, roles = [USER|ADMIN])
  responses:
    Problem:
      description: Lỗi chuẩn RFC 9457
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
