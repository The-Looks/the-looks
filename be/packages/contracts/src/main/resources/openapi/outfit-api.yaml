openapi: 3.1.0
info:
  title: outfit-service
  version: 0.1.0
  description: |
    Gợi ý phối đồ theo dịp + Quick Pick (ưu tiên đồ lâu chưa mặc). Phụ trách: Member 2 (Tuấn).
    Đọc tủ đồ từ wardrobe-service; voting-service gọi GET /api/app/outfits/{outfitId}.
    Quy ước: `/api/app/**` cần JWT, `/api/admin/**` cần role ADMIN, `/api/public/**` không cần đăng nhập.
    Sửa file này trước, review qua PR, rồi mới code (contract-first).
servers:
  - url: http://localhost:8083
    description: local
security:
  - bearerAuth: []
  - cookieAuth: []

paths:
  /api/app/outfits/wear-summary:
    get:
      summary: Số lần mặc và lần mặc gần nhất theo món của người dùng hiện tại
      description: Chỉ tổng hợp WearLog của chủ JWT, không gọi wardrobe-service. Món chưa mặc không có trong kết quả.
      responses:
        '200':
          description: Lịch sử theo món
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [itemId, wearCount, lastWornAt]
                  properties:
                    itemId: { type: string, format: uuid }
                    wearCount: { type: integer, format: int64 }
                    lastWornAt: { type: string, format: date-time }
  /api/app/outfits/calendar:
    get:
      summary: Lịch mặc (Pro) - ngày có outfit đã lên lịch hoặc đã mặc trong khoảng [from, to]
      description: Tối đa 62 ngày. Ngày đã mặc tính theo giờ Việt Nam. Chỉ trả những ngày có dữ liệu.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Các ngày, sắp theo ngày
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CalendarDay' } }
        '400': { $ref: 'common.yaml#/components/responses/Problem' }
        '403': { $ref: 'common.yaml#/components/responses/Problem' }
        '503': { $ref: 'common.yaml#/components/responses/Problem' }
  /api/app/outfits/calendar/{date}:
    parameters:
      - { name: date, in: path, required: true, schema: { type: string, format: date } }
    put:
      summary: Lên lịch một outfit đã lưu cho ngày này (ghi đè lịch cũ)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outfitId]
              properties:
                outfitId: { type: string, format: uuid }
      responses:
        '204': { description: Đã lên lịch }
        '403': { $ref: 'common.yaml#/components/responses/Problem' }
        '404': { $ref: 'common.yaml#/components/responses/Problem' }
        '503': { $ref: 'common.yaml#/components/responses/Problem' }
    delete:
      summary: Bỏ lịch của ngày này
      responses:
        '204': { description: Đã bỏ lịch }
        '403': { $ref: 'common.yaml#/components/responses/Problem' }
        '503': { $ref: 'common.yaml#/components/responses/Problem' }
  /api/app/outfits/suggestions:
    get:
      summary: AI gợi ý outfit theo dịp, chỉ dùng đồ đang có trong tủ, lọc theo thời tiết hiện tại
      parameters:
        - { name: occasion, in: query, required: true, schema: { $ref: '#/components/schemas/Occasion' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 10, default: 3 } }
      responses:
        '200':
          description: Danh sách gợi ý, điểm cao trước (rỗng nếu tủ đồ chưa đủ món)
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/OutfitSuggestion' } }
        '400': { $ref: 'common.yaml#/components/responses/Problem' }
        '503': { $ref: 'common.yaml#/components/responses/Problem' }
  /api/app/outfits/quick-pick:
    get:
      summary: Quick Pick - 1 outfit, ưu tiên món lâu chưa mặc
      responses:
        '200':
          description: Gợi ý
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutfitSuggestion' }
        '204': { description: Tủ đồ chưa đủ món để phối }
        '503': { $ref: 'common.yaml#/components/responses/Problem' }
  /api/app/outfits/preferences:
    get:
      summary: Hồ sơ phong cách (giới tính, phong cách, ngân sách); trống nếu chưa khai
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StylePreferences' }
    put:
      summary: Lưu hồ sơ phong cách. Dùng làm gu ban đầu cho gợi ý outfit và để chọn sản phẩm Gợi ý mua thêm
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StylePreferences' }
      responses:
        '200':
          description: Đã lưu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StylePreferences' }
        '400': { $ref: 'common.yaml#/components/responses/Problem' }
  /api/app/outfits/shopping:
    get:
      summary: Gợi ý mua thêm - món tủ đồ còn thiếu cho dịp này + sản phẩm trên sàn (link affiliate)
      parameters:
        - { name: occasion, in: query, required: true, schema: { $ref: '#/components/schemas/Occasion' } }
      responses:
        '200':
          description: Gợi ý
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShoppingSuggestion' }
        '204': { description: Tủ đồ đủ món, hoặc chưa có sản phẩm phù hợp }
        '503': { $ref: 'common.yaml#/components/responses/Problem' }
  /api/app/outfits/shopping/{productId}/open:
    post:
      summary: Ghi lượt bấm và trả link affiliate (chỉ cho sản phẩm vừa được gợi ý)
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Link sang sàn
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
        '404': { $ref: 'common.yaml#/components/responses/Problem' }
  /api/app/outfits:
    get:
      summary: Outfit đã lưu, mới nhất trước
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Outfit' } }
    post:
      summary: Lưu outfit (chỉ gồm món đã CONFIRMED trong tủ)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemIds]
              properties:
                itemIds: { type: array, minItems: 1, maxItems: 10, items: { type: string, format: uuid } }
                occasion: { $ref: '#/components/schemas/Occasion' }
      responses:
        '201':
          description: Đã lưu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Outfit' }
        '400': { $ref: 'common.yaml#/components/responses/Problem' }
        '503': { $ref: 'common.yaml#/components/responses/Problem' }
  /api/app/outfits/feedback:
    post:
      summary: Thích / không thích một gợi ý (ghi đè lần trước). Tổ hợp bị không thích không được gợi ý lại.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemIds, vote]
              properties:
                itemIds: { type: array, minItems: 1, maxItems: 10, items: { type: string, format: uuid } }
                vote: { type: string, enum: [LIKE, DISLIKE] }
      responses:
        '204': { description: Đã ghi }
        '400': { $ref: 'common.yaml#/components/responses/Problem' }
  /api/admin/outfits/affiliate-stats:
    get:
      summary: (ADMIN) Lượt bấm Gợi ý mua thêm theo ngày, số người bấm, 5 sản phẩm được bấm nhiều nhất
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 90, default: 30 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AffiliateStats' }
  /api/admin/outfits/status:
    get:
      summary: (ADMIN) Cấu hình AI và affiliate (chỉ báo có / không có key)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [aiProvider, geminiConfigured, anthropicConfigured, accessTradeConfigured, aiBudgetUsd]
                properties:
                  aiProvider: { type: string }
                  geminiConfigured: { type: boolean }
                  anthropicConfigured: { type: boolean }
                  accessTradeConfigured: { type: boolean }
                  aiBudgetUsd: { type: number }
  /api/admin/outfits/affiliate-blocks:
    get:
      summary: (ADMIN) Sản phẩm bị chặn khỏi Gợi ý mua thêm
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [source, productId, title, blockedBy, blockedAt]
                  properties:
                    source: { type: string }
                    productId: { type: string }
                    title: { type: string }
                    blockedBy: { type: string, format: uuid }
                    blockedAt: { type: string, format: date-time }
    post:
      summary: (ADMIN) Chặn một sản phẩm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, productId]
              properties:
                source: { type: string, maxLength: 30 }
                productId: { type: string, maxLength: 64 }
                title: { type: string, maxLength: 300 }
      responses:
        '204': { description: Đã chặn }
    delete:
      summary: (ADMIN) Bỏ chặn
      parameters:
        - { name: source, in: query, required: true, schema: { type: string } }
        - { name: productId, in: query, required: true, schema: { type: string } }
      responses:
        '204': { description: Đã bỏ chặn }
  /api/admin/outfits/ai-usage:
    get:
      summary: (ADMIN) Chi phí gọi AI tháng này so với ngân sách, 10 người dùng tốn nhiều nhất
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [month, costUsd, budgetUsd, topUsers]
                properties:
                  month: { type: string, example: '2026-11' }
                  costUsd: { type: number }
                  budgetUsd: { type: number }
                  topUsers:
                    type: array
                    items:
                      type: object
                      required: [ownerId, calls, costUsd]
                      properties:
                        ownerId: { type: string, format: uuid }
                        calls: { type: integer }
                        costUsd: { type: number }
        '403': { $ref: 'common.yaml#/components/responses/Problem' }
  /api/app/outfits/{outfitId}:
    get:
      summary: Outfit kèm ảnh các món (voting-service dùng khi tạo bình chọn)
      parameters:
        - { name: outfitId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutfitDetail' }
        '404': { $ref: 'common.yaml#/components/responses/Problem' }
  /api/app/outfits/{outfitId}/wear:
    post:
      summary: Nút "Mặc bộ này" - ghi lại lần mặc
      parameters:
        - { name: outfitId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Đã ghi }
        '404': { $ref: 'common.yaml#/components/responses/Problem' }

  /api/admin/outfits/users/{id}/data:
    parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      summary: Số outfit đã lưu của người dùng
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [savedOutfitCount], properties: { savedOutfitCount: { type: integer } } } } } }
    delete:
      summary: Xóa outfit, sở thích và dữ liệu phát sinh của người dùng
      responses:
        '204': { description: Đã xóa }

components:
  securitySchemes:
    bearerAuth: { $ref: 'common.yaml#/components/securitySchemes/bearerAuth' }
    cookieAuth: { type: apiKey, in: cookie, name: access_token }
  schemas:
    CalendarDay:
      type: object
      required: [date, wornOutfitIds]
      properties:
        date: { type: string, format: date }
        plannedOutfitId: { type: string, format: uuid, nullable: true }
        wornOutfitIds: { type: array, items: { type: string, format: uuid } }
    AffiliateStats:
      type: object
      required: [clicks, users, daily, top]
      properties:
        clicks: { type: integer, format: int64 }
        users: { type: integer, format: int64 }
        daily:
          type: array
          items:
            type: object
            required: [date, clicks, users]
            properties:
              date: { type: string, format: date }
              clicks: { type: integer, format: int64 }
              users: { type: integer, format: int64 }
        top:
          type: array
          items:
            type: object
            required: [source, productId, title, clicks]
            properties:
              source: { type: string }
              productId: { type: string }
              title: { type: string }
              clicks: { type: integer, format: int64 }
    StylePreferences:
      type: object
      properties:
        gender: { type: [string, 'null'], enum: [MALE, FEMALE, OTHER, null], description: null = không muốn nói }
        styles:
          type: array
          items: { type: string, enum: [feminine, sporty, minimal, streetwear, vintage, office] }
        budget:
          type: [string, 'null']
          enum: [LOW, MID, HIGH, null]
          description: Giá một món. LOW < 200.000đ, MID 200.000–500.000đ, HIGH > 500.000đ, null = không giới hạn
    ShoppingSuggestion:
      type: object
      required: [gap, products]
      properties:
        gap:
          type: object
          required: [category, label]
          properties:
            category: { type: string, enum: [TOP, BOTTOM, SHOES] }
            label: { type: string, description: 'Tên tiếng Việt, vd "giày"' }
        products: { type: array, items: { $ref: '#/components/schemas/ProductOffer' } }
    ProductOffer:
      type: object
      required: [id, title, minPriceVnd, maxPriceVnd, shopName, unitsSold, source]
      properties:
        id: { type: string }
        title: { type: string }
        imageUrl: { type: [string, 'null'], format: uri }
        minPriceVnd: { type: integer, format: int64 }
        maxPriceVnd: { type: integer, format: int64 }
        shopName: { type: string }
        unitsSold: { type: integer, format: int64 }
        source: { type: string, description: 'Sàn bán, vd TIKTOK_SHOP' }
    Occasion:
      type: string
      enum: [SCHOOL, WORK, HANGOUT, DATE]
      description: đi học, đi làm, đi chơi, hẹn hò
    OutfitItem:
      type: object
      required: [id, category]
      properties:
        id: { type: string, format: uuid }
        category: { type: string, example: TOP }
        imageUrl: { type: string, format: uri }
    OutfitSuggestion:
      type: object
      required: [items, score, reason]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/OutfitItem' } }
        occasion: { $ref: '#/components/schemas/Occasion' }
        score: { type: number, description: 0..1, cao hơn là hợp hơn }
        reason: { type: string, example: "Hợp dịp đi làm · Có món 21 ngày chưa mặc" }
    Outfit:
      type: object
      required: [id, itemIds, createdAt]
      properties:
        id: { type: string, format: uuid }
        itemIds: { type: array, items: { type: string, format: uuid } }
        occasion: { $ref: '#/components/schemas/Occasion' }
        createdAt: { type: string, format: date-time }
    OutfitDetail:
      allOf:
        - { $ref: '#/components/schemas/Outfit' }
        - type: object
          required: [itemImageUrls]
          properties:
            itemImageUrls: { type: array, items: { type: string, format: uri } }
