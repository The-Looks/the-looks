# Giá trị cho máy dev (Postgres cài trên máy hoặc be/docker-compose.yml). Không dùng ở staging/prod.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/thelooks_voting
    username: thelooks
    password: thelooks

thelooks:
  security:
    jwt-secret: dev-only-secret-change-me-0123456789abcdef
  services:
    outfit-url: http://localhost:8083
  voting:
    share-base-url: http://localhost:5173
    voter-key-secret: dev-only-voter-key-secret-change-me
