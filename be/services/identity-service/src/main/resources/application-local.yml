# Giá trị cho máy dev (Postgres cài trên máy hoặc be/docker-compose.yml). Không dùng ở staging/prod.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/thelooks_identity
    username: thelooks
    password: thelooks

thelooks:
  security:
    password-pepper: dev-only-password-pepper-change-me-123456789
    issuer: http://localhost:8081
    jwk-set-uri: http://localhost:8081/.well-known/jwks.json
    private-key-path: ./.keys/jwt-private.pem
    web-origin: http://localhost:5173
