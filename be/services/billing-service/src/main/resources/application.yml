server:
  port: 8085

spring:
  application:
    name: billing-service
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema chỉ do Flyway quản lý
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

thelooks:
  security:
    # HMAC (bản hiện tại) và JWKS (sau PR #2): khai báo cả hai để chạy được với cả hai cách xác thực
    jwt-secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:}
    jwk-set-uri: ${JWT_JWK_SET_URI:}
  billing:
    # fake = thanh toán giả (bấm là thành công, chỉ dùng khi dev); payos = cổng PayOS thật
    gateway: ${PAYMENT_GATEWAY:fake}
    # Trang web-app nhận người dùng sau khi thanh toán xong / huỷ
    return-url: ${BILLING_RETURN_URL}
    cancel-url: ${BILLING_CANCEL_URL}
    payos:
      client-id: ${PAYOS_CLIENT_ID:}
      api-key: ${PAYOS_API_KEY:}
      checksum-key: ${PAYOS_CHECKSUM_KEY:}
