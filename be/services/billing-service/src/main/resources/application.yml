server:
  port: 8085

spring:
  application:
    name: billing-service
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema chỉ do Flyway quản lý
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

thelooks:
  security:
    issuer: ${JWT_ISSUER}
    jwk-set-uri: ${JWT_JWK_SET_URI}
    session-validation-uri: ${SESSION_VALIDATION_URI:http://localhost:8081/api/public/auth/session/active}
  billing:
    # sepay = VietQR qua SePay; fake = thanh toán giả (hỏi là thành công, CHỈ dùng khi dev).
    # Không có giá trị mặc định: quên khai báo thì service không khởi động, thay vì cho mọi người lên Pro miễn phí.
    gateway: ${PAYMENT_GATEWAY}
    sepay:
      account-number: ${SEPAY_ACCOUNT_NUMBER:} # số tài khoản nhận tiền đã liên kết với SePay
      bank: ${SEPAY_BANK:} # tên ngắn ngân hàng, vd MBBank, VCB, TPBank
      webhook-api-key: ${SEPAY_WEBHOOK_API_KEY:} # API key đặt khi tạo webhook trên SePay
