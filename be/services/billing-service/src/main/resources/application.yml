server:
  port: 8085

spring:
  application:
    name: billing-service
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema chỉ do Flyway quản lý
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

thelooks:
  services:
    # Hỏi email người đang thanh toán (GET /api/app/me). JWT_ISSUER chính là địa chỉ auth-service
    auth-url: ${AUTH_SERVICE_URL:${JWT_ISSUER:http://localhost:8081}}
  mail:
    # Email nhắc gia hạn qua Brevo (HTTPS). Để trống = tắt
    brevo-api-key: ${BREVO_API_KEY:}
    from: ${MAIL_FROM:}
  security:
    issuer: ${JWT_ISSUER}
    jwk-set-uri: ${JWT_JWK_SET_URI}
    session-validation-uri: ${SESSION_VALIDATION_URI:http://localhost:8081/api/public/auth/session/active}
  billing:
    # payos = cổng PayOS thật; fake = thanh toán giả (bấm là thành công, CHỈ dùng khi dev).
    # Không có giá trị mặc định: quên khai báo thì service không khởi động, thay vì cho mọi người lên Pro miễn phí.
    gateway: ${PAYMENT_GATEWAY}
    # Trang web-app nhận người dùng sau khi thanh toán xong / huỷ
    return-url: ${BILLING_RETURN_URL}
    cancel-url: ${BILLING_CANCEL_URL}
    # Nút "Gia hạn" trong email nhắc (mặc định = trang chọn gói)
    renew-url: ${BILLING_RENEW_URL:${BILLING_CANCEL_URL}}
    payos:
      client-id: ${PAYOS_CLIENT_ID:}
      api-key: ${PAYOS_API_KEY:}
      checksum-key: ${PAYOS_CHECKSUM_KEY:}
