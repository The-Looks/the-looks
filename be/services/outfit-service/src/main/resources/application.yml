server:
  port: 8083

spring:
  application:
    name: outfit-service
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema chỉ do Flyway quản lý
  mvc:
    problemdetails:
      enabled: true # lỗi trả về chuẩn RFC 9457

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

thelooks:
  security:
    issuer: ${JWT_ISSUER}
    jwk-set-uri: ${JWT_JWK_SET_URI}
    session-validation-uri: ${SESSION_VALIDATION_URI:http://localhost:8081/api/public/auth/session/active}
  services:
    auth-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    wardrobe-url: ${WARDROBE_SERVICE_URL}
    billing-url: ${BILLING_SERVICE_URL}
  ai:
    # auto = Claude chính (cần ANTHROPIC_API_KEY), lỗi / hết credit thì Gemini rồi Gemini dự phòng; claude = chỉ Claude; none = chỉ xếp theo điểm (dev)
    provider: ${AI_PROVIDER:auto}
    model: ${AI_MODEL:claude-haiku-5-5}
    # Mức suy nghĩ của Claude: low = trả lời nhanh nhất (mặc định); medium / high chậm hơn, kỹ hơn
    effort: ${AI_EFFORT:low}
    # Gemini: model nhanh nhất làm chính (đổi trên Render bằng GEMINI_MODEL / GEMINI_BACKUP_MODEL, không cần sửa code)
    gemini-model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    gemini-backup-model: ${GEMINI_BACKUP_MODEL:gemini-3.1-flash-lite}
    monthly-budget-usd: ${AI_MONTHLY_BUDGET_USD:25}
  affiliate:
    # "Gợi ý mua thêm" trên TikTok Shop qua AccessTrade. Để trống = tắt tính năng
    accesstrade-api-key: ${ACCESSTRADE_API_KEY:}
    # Chiến dịch lấy datafeeds (merchant, cách nhau dấu phẩy). Để trống = mọi chiến dịch đã duyệt trừ TikTok Shop
    accesstrade-campaigns: ${ACCESSTRADE_CAMPAIGNS:}
  weather:
    # Mặc định TP.HCM (đổi bằng WEATHER_LAT / WEATHER_LON khi chạy cho cơ sở khác)
    latitude: ${WEATHER_LAT:10.8231}
    longitude: ${WEATHER_LON:106.6297}
