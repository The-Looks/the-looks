server:
  port: 8083

spring:
  application:
    name: outfit-service
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema chỉ do Flyway quản lý
  mvc:
    problemdetails:
      enabled: true # lỗi trả về chuẩn RFC 9457

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

thelooks:
  security:
    issuer: ${JWT_ISSUER}
    jwk-set-uri: ${JWT_JWK_SET_URI}
    session-validation-uri: ${SESSION_VALIDATION_URI:http://localhost:8081/api/public/auth/session/active}
  services:
    wardrobe-url: ${WARDROBE_SERVICE_URL}
    billing-url: ${BILLING_SERVICE_URL}
  ai:
    # none = không gọi AI (xếp theo điểm); claude = gọi Claude, cần ANTHROPIC_API_KEY
    provider: ${AI_PROVIDER:none}
    model: ${AI_MODEL:claude-haiku-5-5}
    monthly-budget-usd: ${AI_MONTHLY_BUDGET_USD:25}
  weather:
    # Mặc định TP.HCM (đổi bằng WEATHER_LAT / WEATHER_LON khi chạy cho cơ sở khác)
    latitude: ${WEATHER_LAT:10.8231}
    longitude: ${WEATHER_LON:106.6297}
