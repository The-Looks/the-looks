server:
  port: 8082

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 101MB
  application:
    name: wardrobe-service
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema chỉ do Flyway quản lý
  mvc:
    problemdetails:
      enabled: true # lỗi trả về chuẩn RFC 9457

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

thelooks:
  security:
    issuer: ${JWT_ISSUER}
    jwk-set-uri: ${JWT_JWK_SET_URI}
    session-validation-uri: ${SESSION_VALIDATION_URI:http://localhost:8081/api/public/auth/session/active}
  services:
    billing-url: ${BILLING_SERVICE_URL}
    outfit-url: ${OUTFIT_SERVICE_URL:http://localhost:8083}
  ai:
    # auto = Gemini vision chính, Gemini model dự phòng rồi Claude; none = nhận diện giả (dev)
    provider: ${AI_PROVIDER:auto}
    model: ${AI_MODEL:claude-haiku-5-5}
    # Gemini: model nhanh nhất làm chính (đổi trên Render bằng GEMINI_MODEL / GEMINI_BACKUP_MODEL, không cần sửa code)
    gemini-model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    gemini-backup-model: ${GEMINI_BACKUP_MODEL:gemini-3.1-flash-lite}
  storage:
    # local = lưu file trên máy chủ (dev); cloudinary = Cloudinary (cần CLOUDINARY_*)
    provider: ${IMAGE_STORAGE:local}
    local-dir: ${IMAGE_DIR:./data/wardrobe-images}
    # Địa chỉ web-app (cùng origin với API qua Vite proxy / Vercel rewrites) để tạo link ảnh lưu local
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
