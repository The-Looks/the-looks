# Chạy cả hệ thống bằng Docker (cần build jar trước: ./mvnw package -DskipTests).
#   cp .env.example .env && docker compose up -d --build
# Chỉ cần database: docker compose up -d postgres
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s

  identity-service:
    build: services/identity-service
    environment:
      SPRING_PROFILES_ACTIVE: compose
      DB_URL: jdbc:postgresql://postgres:5432/thelooks_identity
      DB_USER: thelooks
      DB_PASSWORD: thelooks
      JWT_SECRET: ${JWT_SECRET}
    ports: ["8081:8081"]
    depends_on:
      postgres:
        condition: service_healthy

  wardrobe-service:
    build: services/wardrobe-service
    environment:
      SPRING_PROFILES_ACTIVE: compose
      DB_URL: jdbc:postgresql://postgres:5432/thelooks_wardrobe
      DB_USER: thelooks
      DB_PASSWORD: thelooks
      JWT_SECRET: ${JWT_SECRET}
    ports: ["8082:8082"]
    depends_on:
      postgres:
        condition: service_healthy

  outfit-service:
    build: services/outfit-service
    environment:
      SPRING_PROFILES_ACTIVE: compose
      DB_URL: jdbc:postgresql://postgres:5432/thelooks_outfit
      DB_USER: thelooks
      DB_PASSWORD: thelooks
      JWT_SECRET: ${JWT_SECRET}
      WARDROBE_SERVICE_URL: http://wardrobe-service:8082
    ports: ["8083:8083"]
    depends_on:
      postgres:
        condition: service_healthy

  voting-service:
    build: services/voting-service
    environment:
      SPRING_PROFILES_ACTIVE: compose
      DB_URL: jdbc:postgresql://postgres:5432/thelooks_voting
      DB_USER: thelooks
      DB_PASSWORD: thelooks
      JWT_SECRET: ${JWT_SECRET}
    ports: ["8084:8084"]
    depends_on:
      postgres:
        condition: service_healthy

  billing-service:
    build: services/billing-service
    environment:
      SPRING_PROFILES_ACTIVE: compose
      DB_URL: jdbc:postgresql://postgres:5432/thelooks_billing
      DB_USER: thelooks
      DB_PASSWORD: thelooks
      JWT_SECRET: ${JWT_SECRET}
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-fake}
      BILLING_RETURN_URL: ${WEB_APP_URL:-http://localhost:5173}/billing/result
      BILLING_CANCEL_URL: ${WEB_APP_URL:-http://localhost:5173}/plans
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
    ports: ["8085:8085"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
