# Hạ tầng cho máy dev (chạy trong thư mục be/): docker compose up -d
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: thelooks
      POSTGRES_USER: thelooks
      POSTGRES_PASSWORD: thelooks
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thelooks"]
      interval: 5s

  # S3-compatible, lưu ảnh quần áo. Console: http://localhost:9001
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: thelooks
      MINIO_ROOT_PASSWORD: thelooks-dev
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

volumes:
  pgdata:
  miniodata:
