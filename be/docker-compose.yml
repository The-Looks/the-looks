# Chạy cả hệ thống bằng Docker (cần build jar trước: ./mvnw package -DskipTests).
#   cp .env.example .env && docker compose up -d --build
# Chỉ cần database: docker compose up -d postgres
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s

  auth-service:
    build: services/auth-service
    environment:
      SPRING_PROFILES_ACTIVE: compose
      DB_URL: jdbc:postgresql://postgres:5432/thelooks_identity
      DB_USER: thelooks
      DB_PASSWORD: thelooks
      PASSWORD_PEPPER: ${PASSWORD_PEPPER}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt-private.pem
      WEB_ORIGIN: ${WEB_ORIGIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
    volumes:
      - ./.keys/jwt-private.pem:/run/secrets/jwt-private.pem:ro
    ports: ["8081:8081"]
    depends_on:
      postgres:
        condition: service_healthy

  wardrobe-service:
    build: services/wardrobe-service
    environment:
      SPRING_PROFILES_ACTIVE: compose
      DB_URL: jdbc:postgresql://postgres:5432/thelooks_wardrobe
      DB_USER: thelooks
      DB_PASSWORD: thelooks
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json
      SESSION_VALIDATION_URI: http://auth-service:8081/api/public/auth/session/active
    ports: ["8082:8082"]
    depends_on:
      postgres:
        condition: service_healthy

  outfit-service:
    build: services/outfit-service
    environment:
      SPRING_PROFILES_ACTIVE: compose
      DB_URL: jdbc:postgresql://postgres:5432/thelooks_outfit
      DB_USER: thelooks
      DB_PASSWORD: thelooks
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json
      WARDROBE_SERVICE_URL: http://wardrobe-service:8082
      BILLING_SERVICE_URL: http://billing-service:8085
      SESSION_VALIDATION_URI: http://auth-service:8081/api/public/auth/session/active
    ports: ["8083:8083"]
    depends_on:
      postgres:
        condition: service_healthy

  voting-service:
    build: services/voting-service
    environment:
      SPRING_PROFILES_ACTIVE: compose
      DB_URL: jdbc:postgresql://postgres:5432/thelooks_voting
      DB_USER: thelooks
      DB_PASSWORD: thelooks
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json
      OUTFIT_SERVICE_URL: http://outfit-service:8083
      SESSION_VALIDATION_URI: http://auth-service:8081/api/public/auth/session/active
      SHARE_BASE_URL: ${SHARE_BASE_URL}
      VOTER_KEY_SECRET: ${VOTER_KEY_SECRET}
    ports: ["8084:8084"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
