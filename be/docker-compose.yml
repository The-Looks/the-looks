# Chạy cả hệ thống bằng Docker (Dockerfile tự build jar).
#   docker compose --env-file .env up -d --build
# Chỉ cần database: docker compose --env-file .env up -d postgres
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s

  db-setup:
    image: postgres:18
    entrypoint: ["psql", "-h", "postgres", "-U", "postgres", "-v", "ON_ERROR_STOP=1", "-f", "/bootstrap/init.sql"]
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./infrastructure/docker/postgres/init.sql:/bootstrap/init.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  auth-service:
    build: { context: ., dockerfile: services/auth-service/Dockerfile }
    environment:
      SPRING_PROFILES_ACTIVE: compose
      DB_URL: jdbc:postgresql://postgres:5432/thelooks_identity
      DB_USER: thelooks
      DB_PASSWORD: thelooks
      PASSWORD_PEPPER: ${PASSWORD_PEPPER}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt-private.pem
      WEB_ORIGIN: ${WEB_ORIGIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      WARDROBE_SERVICE_URL: http://wardrobe-service:8082
      OUTFIT_SERVICE_URL: http://outfit-service:8083
      VOTING_SERVICE_URL: http://voting-service:8084
      BILLING_SERVICE_URL: http://billing-service:8085
    volumes:
      - ./.keys/jwt-private.pem:/run/secrets/jwt-private.pem:ro
    ports: ["8081:8081"]
    depends_on:
      db-setup:
        condition: service_completed_successfully

  wardrobe-service:
    build: { context: ., dockerfile: services/wardrobe-service/Dockerfile }
    environment:
      SPRING_PROFILES_ACTIVE: compose
      DB_URL: jdbc:postgresql://postgres:5432/thelooks_wardrobe
      BILLING_SERVICE_URL: http://billing-service:8085
      OUTFIT_SERVICE_URL: http://outfit-service:8083
      AI_PROVIDER: ${WARDROBE_AI_PROVIDER:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      IMAGE_STORAGE: ${IMAGE_STORAGE:-local}
      PUBLIC_BASE_URL: ${WEB_APP_URL:-http://localhost:5173}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      DB_USER: thelooks
      DB_PASSWORD: thelooks
      JWT_ISSUER: ${JWT_ISSUER}
      WEB_ORIGIN: ${WEB_ORIGIN}
      JWT_JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json
      SESSION_VALIDATION_URI: http://auth-service:8081/api/public/auth/session/active
    ports: ["8082:8082"]
    volumes:
      - wardrobe_images:/app/data/wardrobe-images
    depends_on:
      db-setup:
        condition: service_completed_successfully

  outfit-service:
    build: { context: ., dockerfile: services/outfit-service/Dockerfile }
    environment:
      SPRING_PROFILES_ACTIVE: compose
      DB_URL: jdbc:postgresql://postgres:5432/thelooks_outfit
      DB_USER: thelooks
      DB_PASSWORD: thelooks
      JWT_ISSUER: ${JWT_ISSUER}
      WEB_ORIGIN: ${WEB_ORIGIN}
      JWT_JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json
      WARDROBE_SERVICE_URL: http://wardrobe-service:8082
      BILLING_SERVICE_URL: http://billing-service:8085
      SESSION_VALIDATION_URI: http://auth-service:8081/api/public/auth/session/active
      AI_PROVIDER: ${OUTFIT_AI_PROVIDER:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["8083:8083"]
    depends_on:
      db-setup:
        condition: service_completed_successfully

  voting-service:
    build: { context: ., dockerfile: services/voting-service/Dockerfile }
    environment:
      SPRING_PROFILES_ACTIVE: compose
      DB_URL: jdbc:postgresql://postgres:5432/thelooks_voting
      DB_USER: thelooks
      DB_PASSWORD: thelooks
      JWT_ISSUER: ${JWT_ISSUER}
      WEB_ORIGIN: ${WEB_ORIGIN}
      JWT_JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json
      OUTFIT_SERVICE_URL: http://outfit-service:8083
      SESSION_VALIDATION_URI: http://auth-service:8081/api/public/auth/session/active
      SHARE_BASE_URL: ${SHARE_BASE_URL}
      VOTER_KEY_SECRET: ${VOTER_KEY_SECRET}
    ports: ["8084:8084"]
    depends_on:
      db-setup:
        condition: service_completed_successfully

  billing-service:
    build: { context: ., dockerfile: services/billing-service/Dockerfile }
    environment:
      SPRING_PROFILES_ACTIVE: compose
      DB_URL: jdbc:postgresql://postgres:5432/thelooks_billing
      DB_USER: thelooks
      DB_PASSWORD: thelooks
      JWT_ISSUER: ${JWT_ISSUER}
      WEB_ORIGIN: ${WEB_ORIGIN}
      JWT_JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json
      SESSION_VALIDATION_URI: http://auth-service:8081/api/public/auth/session/active
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-fake}
      BILLING_RETURN_URL: ${WEB_APP_URL:-http://localhost:5173}/billing/result
      BILLING_CANCEL_URL: ${WEB_APP_URL:-http://localhost:5173}/plans
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
    ports: ["8085:8085"]
    depends_on:
      db-setup:
        condition: service_completed_successfully

volumes:
  pgdata:
  wardrobe_images:
