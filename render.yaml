# Render Blueprint: backend bản demo trên gói free. Các bước làm: docs/viec-thu-cong.md, mục Deploy.
# - Biến `sync: false` là bí mật: Render hỏi khi tạo Blueprint, không ghi vào file này.
# - Gói free không nhận được traffic mạng nội bộ, nên các service gọi nhau qua URL public.
#   Nếu Render đổi tên service (tên đã có người dùng), sửa các URL *.onrender.com bên dưới.
# - billing-service thanh toán qua PayOS; thiếu 3 key PayOS thì billing không khởi động
#   (outfit và wardrobe khi đó tự dùng hạn mức gói Free).

envVarGroups:
  - name: thelooks-shared
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_USER
        value: neondb_owner
      - key: WEB_ORIGIN # link web (không bí mật). Ghi bằng cookie chỉ nhận request từ đúng origin này
        value: https://the-looks.vercel.app
      - key: JWT_ISSUER
        value: https://thelooks-auth.onrender.com
      - key: JWT_JWK_SET_URI
        value: https://thelooks-auth.onrender.com/.well-known/jwks.json
      - key: SESSION_VALIDATION_URI
        value: https://thelooks-auth.onrender.com/api/public/auth/session/active
      - key: BILLING_SERVICE_URL
        value: https://thelooks-billing.onrender.com

services:
  - type: web
    name: thelooks-auth
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./be
    dockerfilePath: ./be/services/auth-service/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: thelooks-shared
      - key: PORT
        value: 8081
      - key: DB_URL # jdbc:postgresql://<host Neon>/thelooks_identity?sslmode=require
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: PASSWORD_PEPPER # không được đổi sau khi có người dùng
        generateValue: true
      - key: JWT_PRIVATE_KEY_PATH # thêm Secret File tên jwt-private.pem trong dashboard
        value: /etc/secrets/jwt-private.pem
      - key: WARDROBE_SERVICE_URL
        value: https://thelooks-wardrobe.onrender.com
      - key: OUTFIT_SERVICE_URL
        value: https://thelooks-outfit.onrender.com
      - key: VOTING_SERVICE_URL
        value: https://thelooks-voting.onrender.com

  - type: web
    name: thelooks-wardrobe
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./be
    dockerfilePath: ./be/services/wardrobe-service/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: thelooks-shared
      - key: PORT
        value: 8082
      - key: DB_URL # jdbc:postgresql://<host Neon>/thelooks_wardrobe?sslmode=require
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL # link Vercel (ảnh tủ đồ đi qua web)
        sync: false
      - key: OUTFIT_SERVICE_URL
        value: https://thelooks-outfit.onrender.com
      - key: AI_PROVIDER # auto = Gemini chính, Gemini Flash Lite rồi Claude dự phòng
        value: auto
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY # dự phòng khi Gemini lỗi; để trống thì bỏ qua
        sync: false
      - key: IMAGE_STORAGE # ảnh tủ đồ lưu trên Cloudinary (ổ đĩa Render bị xoá mỗi lần khởi động lại)
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME # cloudinary.com → Dashboard
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: web
    name: thelooks-outfit
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./be
    dockerfilePath: ./be/services/outfit-service/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: thelooks-shared
      - key: PORT
        value: 8083
      - key: DB_URL # jdbc:postgresql://<host Neon>/thelooks_outfit?sslmode=require
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: WARDROBE_SERVICE_URL
        value: https://thelooks-wardrobe.onrender.com
      - key: AUTH_SERVICE_URL
        value: https://thelooks-auth.onrender.com
      - key: AI_PROVIDER # auto = Gemini chính, Gemini Flash Lite rồi Claude dự phòng
        value: auto
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY # dự phòng khi Gemini lỗi; để trống thì bỏ qua
        sync: false
      - key: ACCESSTRADE_API_KEY # "Gợi ý mua thêm" (TikTok Shop); để trống = tắt
        sync: false

  - type: web
    name: thelooks-voting
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./be
    dockerfilePath: ./be/services/voting-service/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: thelooks-shared
      - key: PORT
        value: 8084
      - key: DB_URL # jdbc:postgresql://<host Neon>/thelooks_voting?sslmode=require
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SHARE_BASE_URL # link Vercel
        sync: false
      - key: OUTFIT_SERVICE_URL
        value: https://thelooks-outfit.onrender.com
      - key: VOTER_KEY_SECRET
        generateValue: true

  - type: web
    name: thelooks-billing
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./be
    dockerfilePath: ./be/services/billing-service/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: thelooks-shared
      - key: PORT
        value: 8085
      - key: DB_URL # jdbc:postgresql://<host Neon>/thelooks_billing?sslmode=require
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: PAYMENT_GATEWAY
        value: payos
      - key: BILLING_RETURN_URL
        value: https://the-looks.vercel.app/billing/result
      - key: BILLING_CANCEL_URL
        value: https://the-looks.vercel.app/plans
      - key: PAYOS_CLIENT_ID # my.payos.vn → kênh thanh toán
        sync: false
      - key: PAYOS_API_KEY
        sync: false
      - key: PAYOS_CHECKSUM_KEY
        sync: false
