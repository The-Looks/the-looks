# Render Blueprint: backend bản demo trên gói free. Các bước làm: docs/viec-thu-cong.md, mục Deploy.
# - Biến `sync: false` là bí mật: Render hỏi khi tạo Blueprint, không ghi vào file này.
# - Gói free không nhận được traffic mạng nội bộ, nên các service gọi nhau qua URL public.
#   Nếu Render đổi tên service (tên đã có người dùng), sửa các URL *.onrender.com bên dưới.
# - billing-service nhận tiền qua SePay; SePay gọi webhook qua link Vercel (xem docs/viec-thu-cong.md).

envVarGroups:
  - name: thelooks-shared
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_USER
        value: neondb_owner
      - key: JWT_ISSUER
        value: https://thelooks-auth.onrender.com
      - key: JWT_JWK_SET_URI
        value: https://thelooks-auth.onrender.com/.well-known/jwks.json
      - key: SESSION_VALIDATION_URI
        value: https://thelooks-auth.onrender.com/api/public/auth/session/active
      - key: BILLING_SERVICE_URL
        value: https://thelooks-billing.onrender.com

services:
  - type: web
    name: thelooks-auth
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./be
    dockerfilePath: ./be/services/auth-service/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: thelooks-shared
      - key: PORT
        value: 8081
      - key: DB_URL # jdbc:postgresql://<host Neon>/thelooks_identity?sslmode=require
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: WEB_ORIGIN # link Vercel, vd https://the-looks.vercel.app
        sync: false
      - key: PASSWORD_PEPPER # không được đổi sau khi có người dùng
        generateValue: true
      - key: JWT_PRIVATE_KEY_PATH # thêm Secret File tên jwt-private.pem trong dashboard
        value: /etc/secrets/jwt-private.pem

  - type: web
    name: thelooks-wardrobe
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./be
    dockerfilePath: ./be/services/wardrobe-service/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: thelooks-shared
      - key: PORT
        value: 8082
      - key: DB_URL # jdbc:postgresql://<host Neon>/thelooks_wardrobe?sslmode=require
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL # link Vercel (ảnh tủ đồ đi qua web)
        sync: false
      - key: AI_PROVIDER
        value: claude
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: thelooks-outfit
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./be
    dockerfilePath: ./be/services/outfit-service/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: thelooks-shared
      - key: PORT
        value: 8083
      - key: DB_URL # jdbc:postgresql://<host Neon>/thelooks_outfit?sslmode=require
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: WARDROBE_SERVICE_URL
        value: https://thelooks-wardrobe.onrender.com
      - key: AI_PROVIDER
        value: claude
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: thelooks-voting
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./be
    dockerfilePath: ./be/services/voting-service/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: thelooks-shared
      - key: PORT
        value: 8084
      - key: DB_URL # jdbc:postgresql://<host Neon>/thelooks_voting?sslmode=require
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SHARE_BASE_URL # link Vercel
        sync: false
      - key: OUTFIT_SERVICE_URL
        value: https://thelooks-outfit.onrender.com
      - key: VOTER_KEY_SECRET
        generateValue: true

  - type: web
    name: thelooks-billing
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./be
    dockerfilePath: ./be/services/billing-service/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: thelooks-shared
      - key: PORT
        value: 8085
      - key: DB_URL # jdbc:postgresql://<host Neon>/thelooks_billing?sslmode=require
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: PAYMENT_GATEWAY
        value: sepay
      - key: SEPAY_ACCOUNT_NUMBER # số tài khoản nhận tiền đã liên kết SePay
        sync: false
      - key: SEPAY_BANK # vd MBBank, VCB, TPBank
        sync: false
      - key: SEPAY_WEBHOOK_API_KEY # API key đặt khi tạo webhook trên SePay
        sync: false
